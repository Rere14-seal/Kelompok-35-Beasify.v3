<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Beasify - Profil</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>



    <!-- Bootstrap CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Beasify -->
    <link href="assets/style.css" rel="stylesheet">
</head>

<body class="profil-body">
    <!-- HEADER / NAVBAR -->
    <header class="header-nav-bg">
        <nav class="navbar p-0">
            <div class="container d-flex justify-content-between align-items-center position-relative header-inner">

                <!-- TRIGGER HAMBURGER SOBAT BEASIFY -->
                <button class="navbar-toggler custom-hamburger hamburger-role-sobat border-0 shadow-none z-2"
                    type="button" data-role-menu="sobat" data-bs-toggle="offcanvas" data-bs-target="#sidebarSobatMenu"
                    aria-controls="sidebarSobatMenu" aria-label="Buka Menu Navigasi">
                </button>

                <!-- LOGO -->
                <a class="navbar-logo position-absolute start-50 translate-middle-x" href="beranda.html">
                    <img src="assets/gambar/Logo beasify.svg" alt="Logo Beasify" class="logo">
                </a>

            </div>
        </nav>
    </header>


    <!-- SIDEBAR MENU SOBAT BEASIFY -->
    <div class="offcanvas offcanvas-start custom-sidebar-menu" tabindex="-1" id="sidebarSobatMenu"
        aria-labelledby="sidebarSobatMenuLabel">

        <!-- SIDEBAR HEADER -->
        <div class="offcanvas-header px-4 pt-4 pb-2">

            <h5 class="visually-hidden" id="sidebarSobatMenuLabel">
                Menu Navigasi Beasify
            </h5>

            <button type="button" class="btn-close-sidebar" data-bs-dismiss="offcanvas" aria-label="Tutup Menu">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>

        <!-- SIDEBAR BODY -->
        <div class="offcanvas-body px-4 pt-4">
            <nav class="d-flex flex-column gap-2">

                <a href="beranda.html" class="sidebar-nav-btn active">
                    Beranda
                </a>

                <a href="bookmark.html" class="sidebar-nav-btn">
                    Bookmark
                </a>

                <a href="riwayat.html" class="sidebar-nav-btn">
                    Riwayat Apply
                </a>

                <a href="profile.html" class="sidebar-nav-btn">
                    Profil
                </a>

            </nav>
        </div>

    </div>
    <!-- MAIN CONTENT -->
    <main class="profil-main py-4">
        <div class="profil-container">

            <!-- AVATAR LINGKARAN -->
            <div class="profil-avatar-wrap text-center mb-4">
                <div class="profil-avatar-circle mx-auto" role="img" aria-label="Foto Profil Pengguna">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>

            <!-- KARTU DATA DIRI & AKADEMIK -->
            <section class="profil-card" aria-labelledby="profilCardHeading">
                <div class="profil-card-header text-center">
                    <h1 id="profilCardHeading" class="profil-card-title mb-0">Data Diri &amp; Akademik</h1>
                </div>

                <form id="profilForm" novalidate>
                    <!-- INFORMASI PRIBADI -->
                    <div class="profil-group">
                        <h2 class="profil-section-title">Informasi Pribadi</h2>

                        <div class="profil-field-box mb-3">
                            <label for="namaLengkap" class="profil-field-label">Nama Lengkap</label>
                            <input type="text" id="namaLengkap" name="namaLengkap" class="profil-field-input"
                                placeholder="Nama Lengkap" readonly>
                        </div>

                        <div class="profil-field-box mb-3">
                            <label for="alamatEmail" class="profil-field-label">Alamat Email</label>
                            <input type="email" id="alamatEmail" name="alamatEmail" class="profil-field-input"
                                placeholder="email@contoh.com" readonly>
                        </div>

                        <div class="profil-field-box mb-3">
                            <label for="nomorTelepon" class="profil-field-label">Nomor Telepon</label>
                            <input type="tel" id="nomorTelepon" name="nomorTelepon" class="profil-field-input"
                                placeholder="+6281234567890" readonly>
                        </div>

                        <div class="profil-field-box mb-0">
                            <label for="kotaDomisili" class="profil-field-label">Kota Domisili</label>
                            <input type="text" id="kotaDomisili" name="kotaDomisili" class="profil-field-input"
                                placeholder="Kota Domisili" readonly>
                        </div>
                    </div>

                    <!-- INFORMASI AKADEMIK -->
                    <div class="profil-group mt-4">
                        <h2 class="profil-section-title">Informasi Akademik</h2>

                        <div class="profil-field-box mb-3">
                            <label for="instansiUniversitas" class="profil-field-label">Instansi Universitas</label>
                            <input type="text" id="instansiUniversitas" name="instansiUniversitas"
                                class="profil-field-input" placeholder="Nama Universitas" readonly>
                        </div>

                        <div class="profil-field-box mb-3">
                            <label for="programStudi" class="profil-field-label">Program Studi</label>
                            <input type="text" id="programStudi" name="programStudi" class="profil-field-input"
                                placeholder="Nama Program Studi" readonly>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <div class="profil-field-box h-100 mb-0">
                                    <label for="jenjangSaatIni" class="profil-field-label">Jenjang Saat ini</label>
                                    <input type="text" id="jenjangSaatIni" name="jenjangSaatIni"
                                        class="profil-field-input" placeholder="Sarjana / Diploma" readonly>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="profil-field-box h-100 mb-0">
                                    <label for="semesterAktif" class="profil-field-label">Semester Aktif</label>
                                    <input type="text" id="semesterAktif" name="semesterAktif"
                                        class="profil-field-input" placeholder="0" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-0">
                            <div class="col-6">
                                <div class="profil-field-box h-100 mb-0">
                                    <label for="ipkNilai" class="profil-field-label">IPK / Nilai Rata-rata</label>
                                    <input type="text" id="ipkNilai" name="ipkNilai" class="profil-field-input"
                                        placeholder="0.00" readonly>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="profil-field-box h-100 mb-0">
                                    <label for="tahunLulus" class="profil-field-label">Tahun Lulus</label>
                                    <input type="text" id="tahunLulus" name="tahunLulus" class="profil-field-input"
                                        placeholder="2027" readonly>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TOMBOL AKSI -->
                    <div class="profil-actions mt-4 d-flex justify-content-center gap-2">
                        <button type="button" id="editProfilBtn" class="btn-profil-edit">
                            Edit
                        </button>
                        <button type="submit" id="saveProfilBtn" class="btn-profil-save d-none">
                            Simpan
                        </button>
                        <button type="button" id="cancelProfilBtn" class="btn-profil-cancel d-none">
                            Batal
                        </button>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <!-- TOAST NOTIFIKASI -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
        <div id="actionToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true"
            style="background-color: var(--secondary-color); color: var(--primary-color); border-radius: 14px;">
            <div class="d-flex">
                <div class="toast-body" id="actionToastBody"
                    style="font-family: var(--font-plus-jakarta); font-size: 13px;">
                    Profil diperbarui!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer custom-footer py-4 mt-5">
        <div class="container text-center">
            <p class="footer-text mb-0">
                © 2026 Beasify. Platform Informasi &amp; Pendaftaran Beasiswa Terpadu.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS Beasify -->
    <script src="assets/main.js"></script>
</body>

</html>
