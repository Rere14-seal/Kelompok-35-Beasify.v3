<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Beasify - Profil Mitra</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Beasify -->
    <link href="assets/style.css" rel="stylesheet">
</head>

<body class="profil-body mitra-profil-body">
    <!-- HEADER / NAVBAR -->
    <header class="header-nav-bg">
        <nav class="navbar p-0">
            <div class="container d-flex justify-content-between align-items-center position-relative header-inner">
                <button class="navbar-toggler custom-hamburger border-0 shadow-none z-2" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu"
                    aria-label="Buka Menu Navigasi">
                </button>

                <a class="navbar-logo position-absolute start-50 translate-middle-x" href="dashboard-mitra.html">
                    <img src="assets/gambar/Logo beasify.svg" alt="Logo Beasify" class="logo">
                </a>
            </div>
        </nav>
    </header>

    <!-- SIDEBAR MENU MITRA (HANYA 2 MENU: DASHBOARD MITRA & PROFIL) -->
    <div class="offcanvas offcanvas-start custom-sidebar-menu" tabindex="-1" id="sidebarMenu"
        aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header px-4 pt-4 pb-2">
            <h5 class="visually-hidden" id="sidebarMenuLabel">Menu Navigasi Mitra Beasify</h5>
            <button type="button" class="btn-close-sidebar" data-bs-dismiss="offcanvas" aria-label="Tutup Menu">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="offcanvas-body px-4 pt-4">
            <nav class="d-flex flex-column gap-2">
                <a href="dashboard-mitra.html" id="navDashboardMitra" class="sidebar-nav-btn active">Dashboard Mitra</a>
                <a href="profile-mitra.html" id="navProfilMitra" class="sidebar-nav-btn">Profil</a>
            </nav>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="profil-main py-4">
        <div class="profil-container">

            <!-- AVATAR INSTANSI MITRA -->
            <div class="profil-avatar-wrap text-center mb-4">
                <div class="mitra-profil-avatar mx-auto" role="img" aria-label="Logo Instansi Mitra">
                    <i class="bi bi-buildings-fill"></i>
                </div>
            </div>

            <!-- KARTU INFORMASI & LEGALITAS INSTANSI MITRA -->
            <section class="profil-card mitra-profil-card" aria-labelledby="mitraProfilCardHeading">
                <div class="profil-card-header text-center">
                    <h1 id="mitraProfilCardHeading" class="profil-card-title mitra-profil-title mb-0">
                        Informasi &amp; Legalitas Instansi Mitra
                    </h1>
                </div>

                <form id="mitraProfilForm" novalidate>
                    <!-- INFORMASI INSTANSI -->
                    <div class="profil-group">
                        <h2 class="profil-section-title">Informasi Instansi</h2>

                        <div class="profil-field-box mitra-profil-field mb-3">
                            <label for="namaResmiInstansi" class="profil-field-label">Nama Resmi Instansi</label>
                            <input type="text" id="namaResmiInstansi" name="namaResmiInstansi"
                                class="profil-field-input" placeholder="Nama Instansi" readonly>
                        </div>

                        <div class="profil-field-box mitra-profil-field mb-3">
                            <label for="kategoriInstansi" class="profil-field-label">Kategori
                                Instansi/Organisasi</label>
                            <input type="text" id="kategoriInstansi" name="kategoriInstansi" class="profil-field-input"
                                placeholder="Instansi/Organisasi" readonly>
                        </div>

                        <div class="profil-field-box mitra-profil-field mb-3">
                            <label for="nomorLegalitasInstansi" class="profil-field-label">Nomor SK Kemenkumham / NPWP
                                Badan</label>
                            <input type="text" id="nomorLegalitasInstansi" name="nomorLegalitasInstansi"
                                class="profil-field-input" placeholder="AHU-0018492.AH.01.04.Tahun 2019" readonly>
                        </div>

                        <div class="profil-field-box mitra-profil-field mb-3">
                            <label for="emailResmiInstansi" class="profil-field-label">Email Resmi Instansi</label>
                            <input type="email" id="emailResmiInstansi" name="emailResmiInstansi"
                                class="profil-field-input" placeholder="Emailmitra@gmail.com" readonly>
                        </div>

                        <div class="profil-field-box mitra-profil-field mb-3">
                            <label for="teleponInstansi" class="profil-field-label">Nomor Telepon</label>
                            <input type="tel" id="teleponInstansi" name="teleponInstansi" class="profil-field-input"
                                placeholder="+62000000000" readonly>
                        </div>

                        <div class="profil-field-box mitra-profil-field mb-0">
                            <label for="alamatKantorPusat" class="profil-field-label">Alamat Kantor Pusat</label>
                            <input type="text" id="alamatKantorPusat" name="alamatKantorPusat"
                                class="profil-field-input" placeholder="Alamat Instansi" readonly>
                        </div>
                    </div>

                    <!-- TOMBOL AKSI -->
                    <div class="profil-actions mt-4 d-flex justify-content-center gap-2">
                        <button type="button" id="editMitraProfilBtn" class="btn-profil-edit mitra-btn-edit">
                            Edit
                        </button>
                        <button type="submit" id="saveMitraProfilBtn" class="btn-profil-save d-none">
                            Simpan
                        </button>
                        <button type="button" id="cancelMitraProfilBtn" class="btn-profil-cancel d-none">
                            Batal
                        </button>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <!-- TOAST NOTIFIKASI -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
        <div id="actionToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true"
            style="background-color: var(--secondary-color); color: var(--primary-color); border-radius: 14px;">
            <div class="d-flex">
                <div class="toast-body" id="actionToastBody"
                    style="font-family: var(--font-plus-jakarta); font-size: 13px;">
                    Profil mitra diperbarui!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer custom-footer py-4 mt-5">
        <div class="container text-center">
            <p class="footer-text mb-0">
                © 2026 Beasify. Platform Informasi &amp; Pendaftaran Beasiswa Terpadu.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS Beasify -->
    <script src="assets/main.js"></script>
</body>

</html>
